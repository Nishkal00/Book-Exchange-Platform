# Render Blueprint for BEP-9 (NF-002 / SR-003): backend API, frontend, and PostgreSQL.
# Secrets are NOT stored here. JWT_SECRET is generated by Render; the other values are
# entered in the Render dashboard when the blueprint is created (sync: false).
services:
  - type: web
    name: bep-backend
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    plan: free
    # Free instances do not support preDeployCommand, so migrations run at container start.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bep-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: bep-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: bep-db
    plan: free
    databaseName: bep
    user: bep
