name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bep
          POSTGRES_PASSWORD: bep
          POSTGRES_DB: bep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bep -d bep"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bep:bep@localhost:5432/bep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check . && ruff format --check .
      - name: Unit tests with coverage (fails under 70%)
        run: pytest
      - name: Migrations apply and roll back on real PostgreSQL
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: docker (build images)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bep-backend ./backend
      - run: docker build -t bep-frontend ./frontend

  deploy:
    name: deploy (Render, main only)
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set; deployment cannot run."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered."
      - name: Wait for backend health check
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "::error::Variable BACKEND_HEALTH_URL is not set."
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS "$BACKEND_HEALTH_URL" | grep -q '"status":"ok"'; then
              echo "Backend healthy after attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend did not return {\"status\":\"ok\"} at $BACKEND_HEALTH_URL within 5 minutes."
          exit 1
