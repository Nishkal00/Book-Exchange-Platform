name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bep
          POSTGRES_PASSWORD: bep
          POSTGRES_DB: bep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bep -d bep"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bep:bep@localhost:5432/bep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check . && ruff format --check .
      - name: Unit tests with coverage (fails under 70%)
        run: pytest
      - name: Migrations apply and roll back on real PostgreSQL
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: docker (build images)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bep-backend ./backend
      - run: docker build -t bep-frontend ./frontend

  deploy:
    name: deploy (PLACEHOLDER - not a real deployment)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Placeholder
        run: |
          echo "PLACEHOLDER ONLY: no deployment is performed by this job yet."
          echo "BEP-9 replaces this with a real deploy and a /health check."
